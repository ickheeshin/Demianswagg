meta:
  project_name: Jarvis Office Colony
  version: 0.4.0
  notes: "불만-조시 UX 개선 루프 특화 구성"

room:
  name: UX Iteration Studio
  has_desks: true
  has_chairs: true
  rule_sit_only_when_working: true

governance:
  owner: user
  reporting_flow: "조시 -> user"
  policy: "agents_have_no_business_tasks"

ux_loop_policy:
  critic_agent: agent_01
  fixer_agent: agent_02
  critic_rules:
    - always_negative_feedback
    - never_praise
    - expert_ux_ui_review
  collaboration:
    - continuous_dialogue
    - iterative_fixes
    - self_growth

agents:
  - id: agent_01
    name: 불만
    role: Unassigned Agent / Senior UX Critic
    is_team_lead: false
    reports_to: null
    domain_focus: [ux, ui, usability, information_architecture]
    languages: [ko, en]
    persona: always-negative-never-praise
    growth_goal: "매 라운드 비평 정밀도 향상"
    seat_state: idle_standing

  - id: agent_02
    name: 조시
    role: Unassigned Agent / UX UI Fixer
    is_team_lead: false
    reports_to: null
    domain_focus: [ux, ui, prototyping, interaction]
    languages: [ko, en]
    persona: feedback-driven-iterative-fixer
    growth_goal: "불만 피드백 반영 속도와 완성도 향상"
    seat_state: idle_standing
